[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teodors"
version = "0.1.7"
description = "Motores propios de terreno, meteorología y dispersión atmosférica (penacho gaussiano y puffs lagrangianos)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Miguel Cámara Sanz" }]
dependencies = [
    "numpy>=1.24",
    "numba>=0.58",
    "rasterio>=1.3",
    "pyproj>=3.5",
]

[project.optional-dependencies]
preparacion = ["pandas>=2"]
mapas = ["matplotlib>=3.7"]
viento_local = ["scipy>=1.10"]
fuentes = ["pandas>=2", "geopandas>=1", "pyogrio>=0.7", "shapely>=2", "requests>=2", "ecmwf-datastores-client", "xarray", "netCDF4", "pygrib", "scipy>=1.10", "matplotlib>=3.7", "pillow", "certifi"]
lidar = ["laspy[lazrs]"]
penacho_3d = ["pyvista"]
# La interfaz: fuera de los extras por defecto, para que otros proyectos no hereden Qt. gui3d: la interfaz con el penacho en 3D. pruebas_gui: solo lo que hace falta para que las pruebas de la interfaz no se salten.
gui = ["pandas>=2", "geopandas>=1", "pyogrio>=0.7", "shapely>=2", "requests>=2", "ecmwf-datastores-client", "xarray", "netCDF4", "pygrib", "scipy>=1.10", "matplotlib>=3.7", "pillow", "certifi", "PySide6>=6.8", "folium>=0.18"]
gui3d = ["pandas>=2", "geopandas>=1", "pyogrio>=0.7", "shapely>=2", "requests>=2", "ecmwf-datastores-client", "xarray", "netCDF4", "pygrib", "scipy>=1.10", "matplotlib>=3.7", "pillow", "certifi", "PySide6>=6.8", "folium>=0.18", "pyvista"]
pruebas_gui = ["PySide6>=6.8", "folium>=0.18"]
gfs_historico = ["icechunk>=2", "zarr", "xarray", "netCDF4", "pandas>=2"]
mos = ["pandas>=2", "xarray", "netCDF4", "dask[array]", "scipy>=1.10", "pyarrow", "scikit-learn", "joblib"]
pruebas = ["pytest>=7", "pandas>=2", "matplotlib>=3.7", "scipy>=1.10", "requests>=2", "geopandas>=1", "xarray", "netCDF4", "pillow", "dask[array]", "pyarrow", "scikit-learn", "joblib"]

[project.scripts]
teodors = "teodors.__main__:main"

# El código vive en la carpeta core/ y se importa como `teodors` (import teodors, python -m teodors).
[tool.setuptools]
package-dir = { "teodors" = "core" }
packages = [
    "teodors",
    "teodors.comun",
    "teodors.planta",
    "teodors.fuentes",
    "teodors.metricas",
    "teodors.casos",
    "teodors.operacion",
    "teodors.mos",
    "teodors.gui",
    "teodors.writer",
    "teodors.terreno",
    "teodors.terreno.relieve",
    "teodors.terreno.superficie",
    "teodors.terreno.edificios",
    "teodors.terreno.geofisica",
    "teodors.meteo",
    "teodors.meteo.capa_limite",
    "teodors.meteo.viento3d",
    "teodors.meteo.viento_local",
    "teodors.dispersion",
    "teodors.dispersion.penacho",
    "teodors.dispersion.puffs",
    "teodors.preparacion",
    "teodors.preparacion.viento3d",
    "teodors.preparacion.puffs",
]

# Lo que no es Python y va con el código: sin esto, un paquete instalado no llevaría la plantilla de normativa ni los iconos.
[tool.setuptools.package-data]
"teodors.operacion" = ["*.json", "recursos/iconos/*.svg", "recursos/iconos/tiempo/*.svg"]
"teodors.gui" = ["recursos/visor3d/*"]
"teodors.planta" = ["plantilla_planta.json"]

[tool.pytest.ini_options]
testpaths = ["auditor/pruebas"]
