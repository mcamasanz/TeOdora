# Auditor de teOdors: ningún cambio entra en main sin dar APTO (ver v*/auditor/README.md).
# Audita la última versión. Las anteriores no cambian: lo vigila su regla R7, que mira todas las versiones y plantas.
name: auditor

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  auditor:
    # Windows: las salidas de referencia son bit a bit las de Windows, la plataforma de los
    # proyectos (en otra plataforma, la biblioteca matemática puede cambiar el último bit).
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # historial completo y etiquetas: R7 las necesita

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "v*/pyproject.toml"

      - name: La última versión
        shell: bash
        run: echo "ULTIMA=$(ls -d v*/ | sort -V | tail -1 | tr -d /)" >> "$GITHUB_ENV"

      - name: Dependencias
        shell: bash
        run: pip install -e "$ULTIMA[pruebas,pruebas_gui]"

      # Sin caché de numba: se invalida con la fecha de los ficheros, que cambia en cada checkout.
      # El núcleo del penacho compila en unos minutos (prueba marcada `compilacion`).
      - name: Auditor
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: cd "$ULTIMA" && python -m auditor
