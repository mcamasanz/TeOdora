<svg width="34" height="104" viewBox="0 0 40 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <!-- cristal: tubo + bulbo -->
  <rect x="14" y="6" width="12" height="92" rx="6" fill="url(#glass)"
        stroke="#ffffffcc" stroke-width="1.3"/>
  <circle cx="20" cy="104" r="13" fill="url(#glass)" stroke="#ffffffcc" stroke-width="1.3"/>
  <!-- mercurio (el JS fija y/height/fill de thmerc y el color de thbulb) -->
  <rect id="thmerc" x="16" y="60" width="8" height="34" fill="#e5482a"/>
  <circle id="thbulb" cx="20" cy="104" r="9" fill="#e5482a"/>
  <!-- marcas de escala -->
  <g stroke="#ffffffaa" stroke-width="1.2" stroke-linecap="round">
    <line x1="26" y1="18" x2="30" y2="18"/>
    <line x1="26" y1="34" x2="29" y2="34"/>
    <line x1="26" y1="50" x2="30" y2="50"/>
    <line x1="26" y1="66" x2="29" y2="66"/>
    <line x1="26" y1="82" x2="30" y2="82"/>
  </g>
</svg>
