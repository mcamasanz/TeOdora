[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lagaus"
version = "0.1.0"
description = "Motores propios de terreno, meteorología y dispersión atmosférica (penacho gaussiano y puffs lagrangianos)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Miguel Cámara Sanz" }]
dependencies = [
    "numpy>=1.24",
    "numba>=0.58",
    "rasterio>=1.3",
    "pyproj>=3.5",
]

[project.optional-dependencies]
pruebas = ["pytest>=7"]

[project.scripts]
lagaus = "lagaus.__main__:main"

# El código vive en la carpeta core/ y se importa como `lagaus` (import lagaus, python -m lagaus).
[tool.setuptools]
package-dir = { "lagaus" = "core" }
packages = [
    "lagaus",
    "lagaus.terreno",
    "lagaus.terreno.relieve",
    "lagaus.terreno.superficie",
    "lagaus.terreno.edificios",
    "lagaus.terreno.geofisica",
    "lagaus.meteo",
    "lagaus.meteo.capa_limite",
    "lagaus.meteo.viento3d",
    "lagaus.dispersion",
    "lagaus.dispersion.penacho",
    "lagaus.dispersion.puffs",
]

[tool.pytest.ini_options]
testpaths = ["auditor/pruebas"]
