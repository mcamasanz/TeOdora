[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odora"
version = "0.1.0"
description = "Motores propios de terreno, meteorología y dispersión atmosférica (penacho gaussiano y puffs lagrangianos)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Miguel Cámara Sanz" }]
dependencies = [
    "numpy>=1.24",
    "numba>=0.58",
    "rasterio>=1.3",
    "pyproj>=3.5",
]

[project.optional-dependencies]
pruebas = ["pytest>=7"]

[project.scripts]
odora = "odora.__main__:main"

# El código vive en la carpeta core/ y se importa como `odora` (import odora, python -m odora).
[tool.setuptools]
package-dir = { "odora" = "core" }
packages = [
    "odora",
    "odora.terreno",
    "odora.terreno.relieve",
    "odora.terreno.superficie",
    "odora.terreno.edificios",
    "odora.terreno.geofisica",
    "odora.meteo",
    "odora.meteo.capa_limite",
    "odora.meteo.viento3d",
    "odora.dispersion",
    "odora.dispersion.penacho",
    "odora.dispersion.puffs",
]

[tool.pytest.ini_options]
testpaths = ["auditor/pruebas"]
